name: CI

# Work reaches main only through PRs, so branch pushes are covered by
# `pull_request`; also triggering on every `push` would run each job twice.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  mutation:
    # Runs on PRs too, so a score below the break threshold blocks the merge
    # instead of turning up on main afterwards. The core is small enough that
    # a full run takes seconds.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # No incremental cache in CI (it is gitignored), so this is always a full run.
      - run: npm run test:mutation
