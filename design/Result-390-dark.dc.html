<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Moneta — result, phone, dark</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="moneta.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; min-height: 2560px; background: #0E1317">
  <dc-import name="Result" dark="{{dark}}" hint-size="390px,2560px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":2560}}'>
class Component extends DCLogic {
  renderVals() {
    return { dark: this.props.dark ?? true };
  }
}
</script>
</body>
</html>
